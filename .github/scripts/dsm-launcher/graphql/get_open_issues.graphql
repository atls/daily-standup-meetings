query GetOpenIssues($id: ID!, $cursor: String) {
  node(id: $id) {
    __typename
    ... on Repository {
      issues(first: 100, after: $cursor, states: OPEN) {
        pageInfo {
          hasNextPage
          endCursor
        }
        nodes {
          id
          number
          title
          issueType {
            name
          }
        }
      }
    }
  }
}
