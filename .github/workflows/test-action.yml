name: Test Action

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v6.0.0
        with:
          node-version: 24.20.0

      - name: Enable Corepack
        run: corepack enable

      - name: Install
        run: yarn install --immutable

      - name: Check
        run: yarn check

      - name: Test
        run: yarn test unit --target src

      - name: Build
        run: yarn service build

      - name: Verify committed bundle
        run: git diff --exit-code -- dist
