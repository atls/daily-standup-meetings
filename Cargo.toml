[package]
name = "atls-daily-standup-meetings"
version = "1.0.0"
edition = "2021"
authors = ["TorinAsakura"]
description = "GitHub Action that creates daily standup issues for organization teams"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
anyhow = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
chrono = "0.4"
chrono-tz = "0.10.4"
