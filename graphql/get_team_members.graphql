query GetTeamMembers($id: ID!, $cursor: String) {
    node(id: $id) {
        __typename
        ... on Team {
            members(first: 100, after: $cursor) {
                pageInfo {
                    hasNextPage
                    endCursor
                }
                nodes {
                    id
                    login
                }
            }
        }
    }
}
